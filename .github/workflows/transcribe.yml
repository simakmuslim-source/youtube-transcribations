name: Transcribe YouTube playlist

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of videos (1–500)"
        required: true
        default: "500"
        type: string
      mode:
        description: "auto = captions first, Whisper fallback; captions = captions only"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - captions
  push:
    paths:
      - ".github/workflows/transcribe.yml"

permissions:
  contents: read

concurrency:
  group: playlist-transcription
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure YouTube cookies (optional)
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "${YOUTUBE_COOKIES_B64:-}" ]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$RUNNER_TEMP/youtube-cookies.txt"
            chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
            echo "YOUTUBE_COOKIES_FILE=$RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_ENV"
            echo "Private YouTube cookies configured."
          else
            echo "No YOUTUBE_COOKIES_B64 secret configured; YouTube may block this runner."
          fi
      - name: Run transcription
        env:
          VIDEO_LIMIT: ${{ github.event.inputs.limit || '500' }}
          TRANSCRIPTION_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          python main.py \
            --playlist "https://youtube.com/playlist?list=PLsb6UHPckO4tUqnS53ef529-7neQ6btEz" \
            --mode "$TRANSCRIPTION_MODE" \
            --limit "$VIDEO_LIMIT" \
            --output output \
            --delay 1

      - name: Upload transcript ZIP and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-transcripts
          path: |
            output/youtube-transcripts.zip
            output/report.csv
            output/metadata.json
          if-no-files-found: warn
          retention-days: 14
