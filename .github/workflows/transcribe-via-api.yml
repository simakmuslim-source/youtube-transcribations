name: Extract playlist transcripts via public transcript API

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/transcribe-via-api.yml"
      - "transcribe_via_api.py"

permissions:
  contents: read

concurrency:
  group: playlist-transcription-api
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Whisper fallback dependencies
        run: python -m pip install --upgrade pip && python -m pip install faster-whisper pytubefix
      - name: Fetch transcripts (API first, Whisper fallback)
        run: python transcribe_via_api.py
      - name: Upload transcript ZIP and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-transcripts-api
          path: |
            output/youtube-transcripts.zip
            output/report.csv
            output/metadata.json
          if-no-files-found: warn
          retention-days: 14
